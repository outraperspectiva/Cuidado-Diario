  <circle cx="640" cy="30" r="4" fill="#FFFFFF" opacity="0.9" />
  <circle cx="654" cy="30" r="5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="670" cy="30" r="6" fill="#FFFFFF" opacity="0.9" />
  <!-- Battery -->
