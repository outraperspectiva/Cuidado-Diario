    </g>

    <!-- Tab 2: Remédios -->
    <g transform="translate(190, 1235)">
      <circle cx="35" cy="24" r="22" fill="#EBF5FF" />
      <rect x="26" y="19" width="18" height="10" rx="5" transform="rotate(-45 35 24)" stroke="#103557" stroke-width="2.5" fill="none" />
      <text x="35" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#103557">Remédios</text>
    </g>

    <!-- Tab 3: Dor -->
