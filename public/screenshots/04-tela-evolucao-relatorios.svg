      <circle cx="35" cy="24" r="22" fill="transparent" />
      <path d="M25 28 L35 18 L45 28 M28 25 L28 33 L42 33 L42 25" stroke="#94A3B8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="35" y="52" text-anchor="middle" font-size="13" font-weight="500" fill="#94A3B8">Hoje</text>
    </g>

    <!-- Tab 2: Remédios -->
    <g transform="translate(190, 1235)">
      <circle cx="35" cy="24" r="22" fill="transparent" />
      <rect x="26" y="19" width="18" height="10" rx="5" transform="rotate(-45 35 24)" stroke="#94A3B8" stroke-width="2.5" fill="none" />
      <text x="35" y="52" text-anchor="middle" font-size="13" font-weight="500" fill="#94A3B8">Remédios</text>
    </g>

    <!-- Tab 3: Dor -->
    <g transform="translate(340, 1235)">
      <circle cx="35" cy="24" r="22" fill="transparent" />
      <path d="M35 16 C30 16 26 21 26 26 C26 34 35 40 35 40 C35 40 44 34 44 26 C44 21 40 16 35 16 Z" stroke="#94A3B8" stroke-width="2.2" fill="none" />
      <text x="35" y="52" text-anchor="middle" font-size="13" font-weight="500" fill="#94A3B8">Dor</text>
    </g>

    <!-- Tab 4: Fisio -->
    <g transform="translate(490, 1235)">
      <circle cx="35" cy="24" r="22" fill="transparent" />
      <path d="M27 30 L32 20 L38 28 L43 23" stroke="#94A3B8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="35" y="52" text-anchor="middle" font-size="13" font-weight="500" fill="#94A3B8">Fisio</text>
    </g>

    <!-- Tab 5: Evolução -->
    <g transform="translate(635, 1235)">
      <circle cx="35" cy="24" r="22" fill="#EBF5FF" />
      <path d="M26 33 L32 26 L38 30 L44 20" stroke="#103557" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <text x="35" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#103557">Evolução</text>
    </g>

    <!-- Home Indicator bar -->
    <rect x="285" y="1312" width="180" height="5" rx="2.5" fill="#CBD5E1" />
  </g>
</svg>

