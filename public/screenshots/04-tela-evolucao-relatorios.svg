      <text x="40" y="145" fill="#94A3B8" font-size="12" text-anchor="end">5</text>
      <text x="40" y="195" fill="#94A3B8" font-size="12" text-anchor="end">2</text>
      <text x="40" y="245" fill="#94A3B8" font-size="12" text-anchor="end">0</text>

